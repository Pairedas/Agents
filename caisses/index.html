function catsHTML(s) { if (!listeCats(s).includes(s.categorie)) s.categorie = listeCats(s)[0]; return listeCats(s).map(c => `<button class="puce ${s.categorie === c ? 'on' : ''}" data-act="s-cat" data-val="${esc(c)}">${ICO(icoCat(c))}${esc(c)}</button>`).join(''); }
function oubliHTML(s) {
  const e = L.ecartsNonResolus(S).find(x => x.caisse === s.caisse);
  if (!e) return '';
  return `<label class="bascule"><input type="checkbox" id="s-oubli" data-cl="${esc(e.cloture.id)}" ${s.oublieDe === e.cloture.id ? 'checked' : ''}><span>C’est l’opération oubliée de l’écart du ${esc(jourLib(e.cloture.jour).toLowerCase())} (<b class="num">${FS(e.ecart)}</b>) : elle sera comptée avant ce comptage.</span></label>`;
}
const titreSaisie = s => s.type === 'entree' ? 'Nouvelle entrée' : 'Nouvelle sortie';
function salonHTML(s) {
  const sal = S.reglages.caisseSalon;
  if (s.type !== 'sortie' || !sal || s.caisse === sal || !L.caisse(S, sal) || L.caisse(S, sal).archivee) return '';
  return `<label class="bascule" style="background:var(--accent-soft)"><input type="checkbox" id="s-salon" ${s.pourSalon ? 'checked' : ''}><span><b>Pour le salon</b> : dépense payée depuis ${N(s.caisse)}, comptée comme investissement dans le salon</span></label>`;
}
FEUILLES.saisie = () => {
  const s = UI.saisie, act = L.caissesActives(S), hier = L.jourISO(Date.now() - L.JOUR_MS);
  return `<div class="sh-head"><button class="icon-btn" data-act="nouveau" aria-label="Retour">${ICO('chev-l')}</button><h3 id="s-titre">${titreSaisie(s)}</h3>${X}</div>
    <div class="seg2" role="group" aria-label="Type">${['entree', 'sortie'].map(t => `<button class="${s.type === t ? 'on' : ''}" data-act="s-type" data-val="${t}" aria-pressed="${s.type === t}">${ICO(t === 'entree' ? 'in' : 'out', 's')}${t === 'entree' ? 'Entrée' : 'Sortie'}</button>`).join('')}</div>
    ${montantHTML('s-montant')}<div class="ctx" id="s-ctx"></div>
    <div class="chips" id="s-caisses" role="group" aria-label="Caisse">${act.map(c => `<button class="puce caisse ${s.caisse === c.id ? 'on' : ''}" style="${gvars(c.id)}" data-act="s-caisse" data-id="${esc(c.id)}"><span class="pt"></span>${esc(c.nom)}</button>`).join('')}</div>
    <div class="chips" id="s-cats" role="group" aria-label="Catégorie" style="margin-top:var(--s2)">${catsHTML(s)}</div>
    <div class="chips" id="s-jours" role="group" aria-label="Date" style="margin-top:var(--s2)"><button class="puce ${s.jour === auj() ? 'on' : ''}" data-act="s-jour" data-val="${auj()}">Aujourd’hui</button><button class="puce ${s.jour === hier ? 'on' : ''}" data-act="s-jour" data-val="${hier}">Hier</button>
    <label class="puce date-p ${s.jour !== auj() && s.jour !== hier ? 'on' : ''}" id="s-date-l">${ICO('cal')}<span id="s-date-t">${s.jour !== auj() && s.jour !== hier ? esc(L.dateCourte(s.jour)) : 'Autre date'}</span><input type="date" id="s-date" aria-label="Autre date" max="${auj()}" value="${s.jour !== auj() && s.jour !== hier ? esc(s.jour) : ''}"></label></div>
    <input class="field" id="s-note" style="margin-top:var(--s2)" maxlength="200" placeholder="Note (facultatif) : client, objet…" value="${esc(s.note)}" enterkeyhint="done">
    <div id="s-salon-zone">${salonHTML(s)}</div>
    <div id="s-oubli-zone">${oubliHTML(s)}</div>
    ${pave('s-montant')}
    <button class="btn btn-pri" data-act="s-ok" id="s-ok">${s.type === 'entree' ? 'Enregistrer l’entrée' : 'Enregistrer la sortie'}</button>`;
};
APRES.saisie = () => majMontant('s-montant');

// Prêt
function phrasePret() {
  const p = UI.pret, el = $('#p-phrase'); if (!el || !p) return;
  const n = Number(UI.mt['p-montant'] || 0), mt = `<b class="num">${n ? F(n) : '…'}</b>`;
  if (!(p.de && p.vers && p.de !== p.vers)) { el.innerHTML = '<p class="phrase neg">Choisis deux caisses différentes</p>'; return; }
  const sd = L.soldeAttendu(S, p.de), sv = L.soldeAttendu(S, p.vers);
  const phrase = p.mode === 'apport'
    ? (p.vers === S.reglages.caisseSalon ? `<b>${N(p.de)}</b> investit ${mt} dans <b>${N(p.vers)}</b> · personne ne doit rien` : `<b>${N(p.de)}</b> donne ${mt} à <b>${N(p.vers)}</b> · sans dette`)
    : `<b>${N(p.de)}</b> prête ${mt} à <b>${N(p.vers)}</b> · <b>${N(p.vers)}</b> devra rembourser`;
  el.innerHTML = `<div class="flux" style="--a:${teinte(p.de)[0]};--b:${teinte(p.vers)[0]}"><div class="flux-p">${avatar(p.de)}<span class="flux-n">${N(p.de)}</span></div><div class="flux-fl"><b class="flux-mt num">${n ? F(n) : '…'}</b><span class="flux-l"></span></div><div class="flux-p">${avatar(p.vers)}<span class="flux-n">${N(p.vers)}</span></div></div>
    <p class="phrase">${phrase}</p>
    <p class="ctx" style="margin:0 0 var(--s3)">Après : ${N(p.de)} <b class="num ${sd - n < 0 ? 'neg' : ''}">${F(sd - n)}</b> · ${N(p.vers)} <b class="num">${F(sv + n)}</b></p>`;
}
FEUILLES.pret = () => {
  const p = UI.pret, act = L.caissesActives(S);
  const puces = (k, a) => act.map(c => `<button class="puce caisse ${p[k] === c.id ? 'on' : ''}" style="${gvars(c.id)}" data-act="${a}" data-id="${esc(c.id)}"><span class="pt"></span>${esc(c.nom)}</button>`).join('');
  const ap = p.mode === 'apport';
  return tete(ap ? 'Transfert sans dette' : 'Prêt entre caisses', 'nouveau') + `<div class="seg2" role="group" aria-label="Type de transfert" style="margin-bottom:var(--s3)">
      <button class="${ap ? '' : 'on'}" data-act="p-mode" data-val="pret" aria-pressed="${!ap}">${ICO('swap', 's')}Prêt (à rembourser)</button><button class="${ap ? 'on' : ''}" data-act="p-mode" data-val="apport" aria-pressed="${ap}">${ICO('trend-up', 's')}Sans dette</button></div>
    <div id="p-phrase"></div>
    <div class="lbl" style="margin-top:0">${ap ? 'D’où vient l’argent ?' : 'Qui prête ?'}</div><div class="chips" id="p-de">${puces('de', 'p-de')}</div>
    <div class="lbl">${ap ? 'Où va-t-il ?' : 'À qui ?'}</div><div class="chips" id="p-vers">${puces('vers', 'p-vers')}</div>
    ${montantHTML('p-montant')}
    <input class="field" id="p-note" maxlength="200" placeholder="Motif (obligatoire) : ${ap ? 'carrelage, loyer du salon…' : 'recharge UV, dépannage…'}" value="${esc(p.note || '')}" enterkeyhint="done">
    ${pave('p-montant')}
    <button class="btn btn-pri" data-act="p-ok">${ap ? 'Enregistrer le transfert' : 'Enregistrer le prêt'}</button>
    <p class="aide" style="text-align:center">${ap ? 'L’argent change de caisse, personne ne doit rien à personne.' : 'Le salaire n’est pas un prêt : il a son propre bouton.'}</p>`;
};
APRES.pret = () => { majMontant('p-montant'); phrasePret(); };

// Salaire (depuis ＋)
FEUILLES.salaire = () => {
  const es = L.etatSalaire(S), perso = S.reglages.caissePerso;
  const parts = S.reglages.salaire.parts.filter(p => p.montant > 0 && p.caisse !== perso);
  return tete('Salaire', 'nouveau') + `<div style="text-align:center;padding:var(--s2) 0 var(--s4)"><div class="aide" style="margin:0">Salaire de ${esc(L.nomMois(es.mois))} · prévu le ${esc(L.dateCourte(es.date))}</div>
    <div class="res-mt num">${grand(es.verse ? es.montantVerse : es.total)}</div>${es.verse ? `<span class="pill p-ok">${ICO('check')}déjà versé</span>` : `<span class="pill p-at">pas encore versé</span>`}</div>
    <div class="card flush liste" style="box-shadow:none">${parts.map(p => `<div class="ligne-r">${avatar(p.caisse, 'sm')}<span class="g">${N(p.caisse)} ${ICO('chev-r', 'xs')} ${N(perso)}</span><b class="num">${F(p.montant)}</b></div>`).join('')}</div>
    <div class="pile" style="margin-top:var(--s4)">${es.verse ? '' : `<button class="btn btn-pri" data-act="salaire-verser">Verser ${F(es.total)} vers ${N(perso)}</button>`}
    <button class="btn btn-sec" data-act="salaire-regler">Modifier les montants</button></div>`;
};

// Remboursement partiel
FEUILLES.remb = f => {
  const du = L.detteEntre(S, f.deb, f.cre);
  return tete('Rembourser') + `<div class="flux" style="--a:${teinte(f.deb)[0]};--b:${teinte(f.cre)[0]}"><div class="flux-p">${avatar(f.deb)}<span class="flux-n">${N(f.deb)}</span></div><div class="flux-fl"><b class="flux-mt num">${F(du)}</b><span class="flux-l"></span></div><div class="flux-p">${avatar(f.cre)}<span class="flux-n">${N(f.cre)}</span></div></div>
    <p class="phrase"><b>${N(f.deb)}</b> doit <b class="num">${F(du)}</b> à <b>${N(f.cre)}</b>. Combien rembourse-t-elle maintenant ?</p>
    ${montantHTML('r-montant')}${pave('r-montant')}
    <div class="duo"><button class="btn btn-sec" data-act="remb-tout" data-deb="${esc(f.deb)}" data-cre="${esc(f.cre)}">Tout</button><button class="btn btn-pri" data-act="r-ok">Rembourser</button></div>`;
};
APRES.remb = () => majMontant('r-montant');

// Détail d'une opération
FEUILLES.mv = f => {
  const m = S.mouvements.find(x => x.id === f.id);
  if (!m) return tete('Introuvable');
  const i = infoMv(m), ty = { entree: 'Entrée', sortie: 'Sortie', pret: 'Prêt entre caisses', remb: 'Remboursement', salaire: 'Salaire', ajust: 'Ajustement (écart expliqué)', apport: m.categorie === 'Investissement' ? 'Investissement (sans dette)' : 'Transfert sans dette' }[m.type];
  const rows = [['Type', ty], m.caisse ? ['Caisse', N(m.caisse)] : ['De → vers', `${N(m.de)} → ${N(m.vers)}`], m.categorie && m.type !== 'pret' && m.type !== 'apport' ? ['Catégorie', esc(m.categorie)] : null,
    ['Date', esc(jourLib(m.jour)) + (m.jour === L.jourISO(m.quand) ? ' à ' + L.heure(m.quand) : '')], m.note ? ['Note', esc(m.note)] : null,
    m.pourSalon ? ['Salon', 'Dépense pour le salon (investissement)'] : null,
    m.cloture && m.type !== 'ajust' ? ['Rattachée', 'Opération oubliée d’une clôture'] : null, m.source && m.source !== 'manuel' ? ['Source', esc(m.source)] : null].filter(Boolean);
  const sg = m.type === 'entree' ? m.montant : m.type === 'sortie' ? -m.montant : m.type === 'ajust' ? m.montant : null;
  return tete('Opération') + `<div style="text-align:center;padding:var(--s2) 0 var(--s4)"><span class="tx-ic ${i.tn}" style="width:56px;height:56px;margin:0 auto var(--s3)">${ICO(i.ic)}</span><div class="res-mt num ${sg > 0 ? 'pos' : ''}" style="margin:0">${sg == null ? grand(m.montant) : grand(sg, true)}</div><div class="aide">${i.t}</div></div>
    <div class="card flush" style="box-shadow:none"><table class="tableau" style="margin:0 var(--s4);width:calc(100% - 2*var(--s4))">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
    <button class="btn btn-sec" style="margin-top:var(--s4);color:var(--neg)" data-act="suppr" data-id="${esc(m.id)}">${ICO('trash')}Supprimer l’opération</button>`;
};

// Écart (détail d'une clôture)
function ecartHTML(cl, enWiz) {
  const c = L.caisse(S, cl.caisse), e = L.ecartActuel(S, cl), st = L.statutCloture(S, cl);
  let h = enWiz ? '' : tete(`Clôture · ${esc(c.nom)}`);
  const genre = e < 0 ? 'neg' : e > 0 ? 'pos' : 'ok';
  const lib = e === 0 ? (cl.ecartInitial === 0 ? 'Aucun écart' : 'Écart réglé') : e < 0 ? 'Il manque' : 'Il y a en trop';
  let deja = '';
  if (e !== 0 && cl.dejaSignale && cl.dejaSignale === cl.ecartInitial) deja = 'Même écart qu’à la clôture précédente : rien de nouveau aujourd’hui, mais il n’est toujours pas expliqué.';
  else if (e !== 0 && cl.dejaSignale) deja = `Dont ${FS(cl.dejaSignale)} déjà signalé à la clôture précédente.`;
  h += `<div class="res ${genre}"><span class="res-ic">${ICO(e === 0 ? 'check' : 'alert')}</span><div class="res-lbl">${lib}</div>
    <div class="res-mt num">${e === 0 ? (cl.ecartInitial ? `<s style="opacity:.55">${FS(cl.ecartInitial)}</s>` : '0 F') : FS(e)}</div>${pillStatut(st)}
    ${deja ? `<p class="aide">${deja}</p>` : ''}<p class="aide">${esc(jourLib(cl.jour))} à ${L.heure(cl.quand)}</p></div>
    <div class="duo" style="margin-top:var(--s3)"><div class="boite"><span>Attendu</span><b class="num">${F(cl.attendu)}</b></div><div class="boite"><span>Réel compté</span><b class="num">${F(cl.reel)}</b>${cl.detail ? `<span class="num">élec. ${F(cl.detail.electronique)} · esp. ${F(cl.detail.especes)}</span>` : ''}</div></div>`;
  if (cl.notes.length) h += `<div class="lbl">Explications notées</div><div class="card flush liste" style="box-shadow:none">${cl.notes.map(n => `<div class="note-l"><div class="t">${esc(n.texte)}</div><div class="s">${esc(jourLib(L.jourISO(n.quand)))} ${L.heure(n.quand)}${n.ajustement != null ? ' · ajustement ' + FS(n.ajustement) : ''}</div></div>`).join('')}</div>`;
  if (st === 'a_expliquer') {
    const type = e < 0 ? 'sortie' : 'entree';
    const cats = [...new Set(type === 'sortie' ? L.CATEGORIES.sortie.concat(L.CATEGORIES.entree) : L.CATEGORIES.entree.concat(L.CATEGORIES.sortie))];
    if (UI.mt['eo-montant'] == null) UI.mt['eo-montant'] = String(Math.abs(e));
    h += `<div class="lbl">${e < 0 ? 'Il manque de l’argent : une sortie, un retrait ou des frais oubliés ?' : 'Il y a plus que prévu : une entrée ou une commission oubliée ?'}</div>
      <div class="pile"><button class="act-l" data-act="ouvrir-bloc" data-bloc="eo"><span class="tx-ic t-acc">${ICO('plus')}</span><span class="g"><span class="t">Ajouter l’opération oubliée</span><span class="s" style="display:block">L’écart se règle tout seul</span></span>${ICO('chev-r')}</button>
      <div id="eo" class="cache bloc"><div class="seg2" id="eo-type" data-val="${type}">${['entree', 'sortie'].map(t => `<button class="${t === type ? 'on' : ''}" data-act="seg" data-val="${t}">${ICO(t === 'entree' ? 'in' : 'out', 's')}${t === 'entree' ? 'Entrée' : 'Sortie'}</button>`).join('')}</div>
        ${montantHTML('eo-montant')}
        <div class="chips" id="eo-cats" data-val="${esc(cats[0])}">${cats.map((x, i) => `<button class="puce ${i ? '' : 'on'}" data-act="eo-cat" data-val="${esc(x)}">${ICO(icoCat(x))}${esc(x)}</button>`).join('')}</div>
        <input class="field" id="eo-note" style="margin-top:var(--s2)" maxlength="200" placeholder="Note : ex. frais de retrait">
        ${pave('eo-montant')}<button class="btn btn-pri" data-act="eo-ok" data-cl="${esc(cl.id)}">Ajouter l’opération</button></div>
      <button class="act-l" data-act="ouvrir-bloc" data-bloc="ex"><span class="tx-ic t-warn">${ICO('pen')}</span><span class="g"><span class="t">Expliquer l’écart</span><span class="s" style="display:block">Noter la raison, et clore si besoin</span></span>${ICO('chev-r')}</button>
      <div id="ex" class="cache bloc"><label class="form-l" for="ex-texte">Explication</label><textarea class="field" id="ex-texte" maxlength="300" placeholder="ex : Yao doit 5 000, il rembourse demain"></textarea>
        <div class="pile" style="margin-top:var(--s3)"><button class="btn btn-pri" data-act="ex-clore" data-cl="${esc(cl.id)}">Noter et clore l’écart de ${FS(e)}</button>
        <button class="btn btn-sec" data-act="ex-note" data-cl="${esc(cl.id)}">Noter seulement (reste à expliquer)</button></div>
        <p class="aide">« Clore » ajoute un ajustement visible dans l’historique et le bilan : rien ne disparaît.</p></div></div>`;
  } else if (st === 'reporte') {
    const der = L.derniereCloture(S, cl.caisse);
    h += `<p class="aide" style="margin:var(--s4) 2px var(--s3)">Cet écart est repris dans la clôture de ${esc(jourLib(der.jour).toLowerCase())}.</p><button class="btn btn-sec" data-act="ecart" data-id="${esc(der.id)}">Voir la dernière clôture</button>`;
  } else if (st === 'remplacee') {
    h += `<p class="aide" style="margin:var(--s4) 2px">Caisse recomptée le même jour : c’est le dernier comptage qui compte.</p>`;
  }
  if (enWiz) {
    const dernier = UI.wiz.i >= UI.wiz.liste.length - 1;
    h += `<button class="btn ${e === 0 ? 'btn-pri' : 'btn-sec'}" style="margin-top:var(--s4)" data-act="wiz-suivant">${e === 0 ? (dernier ? 'Terminer' : 'Caisse suivante') : (dernier ? 'Terminer (l’écart reste à expliquer)' : 'Continuer, l’écart reste à expliquer')}${ICO('chev-r', 's')}</button>`;
  }
  return h;
}
FEUILLES.ecart = f => { const cl = L.trouverCloture(S, f.id); return cl ? `<div class="pas">${ecartHTML(cl, false)}</div>` : tete('Introuvable'); };
APRES.ecart = () => majMontant('eo-montant');

// Clôture guidée : une caisse par écran
FEUILLES.wiz = () => {
  const w = UI.wiz, n = w.liste.length;
  if (w.i >= n) {
    const cls = w.liste.map(id => L.clotureDuJourPour(S, id, auj()));
    const reste = L.ecartsNonResolus(S).length, faites = cls.filter(Boolean).length;
    const tA = cls.reduce((s, c) => s + (c ? c.attendu : 0), 0), tR = cls.reduce((s, c) => s + (c ? c.reel : 0), 0);
    const res = w.liste.map((id, k) => {
      const cl = cls[k];
      if (!cl) return `<div class="ligne-r">${avatar(id, 'sm')}<span class="g">${N(id)}</span><span class="pill p-gr">passée</span></div>`;
      const st = L.statutCloture(S, cl), e = L.ecartActuel(S, cl);
      return `<div class="ligne-r">${avatar(id, 'sm')}<span class="g">${N(id)}</span><span class="d">${e ? `<b class="num ${e < 0 ? 'neg' : 'pos'}">${FS(e)}</b>` : ''}${pillStatut(st)}</span></div>`;
    }).join('');
    return `<div class="pas"><div class="sh-head"><h3></h3>${X}</div><div class="fin ${reste ? 'at' : 'ok'}"><span class="res-ic">${ICO(reste ? 'alert' : 'check')}</span><h3>Clôture terminée</h3>
      <p>${faites} caisse${faites > 1 ? 's' : ''} comptée${faites > 1 ? 's' : ''}${n - faites ? ' · ' + (n - faites) + ' passée' + (n - faites > 1 ? 's' : '') : ''}</p></div>
      <div class="card flush liste" style="box-shadow:none">${res}</div>
      ${faites ? `<div class="duo" style="margin-top:var(--s3)"><div class="boite"><span>Total attendu</span><b class="num">${F(tA)}</b></div><div class="boite"><span>Total compté</span><b class="num ${tR - tA < 0 ? 'neg' : ''}">${F(tR)}</b></div></div>` : ''}
      <p class="aide" style="margin:var(--s4) 2px">${reste ? reste + ' écart' + (reste > 1 ? 's restent' : ' reste') + ' « à expliquer ». Tu peux les régler plus tard depuis l’accueil : ils ne disparaissent pas.' : 'Tout est juste. Bonne soirée !'}</p>
      <div class="pile"><button class="btn btn-pri" data-act="point">${ICO('receipt')}Voir le point du jour</button><button class="btn btn-sec" data-act="fermer">Terminer</button></div></div>`;
  }
  const id = w.liste[w.i], c = L.caisse(S, id);
  let h = `<div class="sh-head" style="margin-bottom:0"><span class="etape">Caisse ${w.i + 1} sur ${n}</span>${X}</div>
    <div class="prog" aria-hidden="true">${w.liste.map((_, k) => `<i class="${k < w.i ? 'f' : k === w.i ? 'c' : ''}"></i>`).join('')}</div>
    <div class="pas"><div class="wiz-c" style="${gvars(id)}"><span class="solde-ic">${ICO(icoCaisse(id))}</span><div><b>${esc(c.nom)}</b>${c.numero ? `<span>${esc(c.numero)}</span>` : ''}</div></div>`;
  if (w.cl) return h + ecartHTML(L.trouverCloture(S, w.cl), true) + '</div>';
  const att = L.soldeAttendu(S, id), pdv = !!c.pdv, part = w.part || 'w-uv';
  const partBtn = (k, lib, ic) => `<button class="part ${part === k ? 'on' : ''}" data-act="w-part" data-k="${k}" aria-pressed="${part === k}"><span>${ICO(ic, 'xs')} ${lib}</span><b class="num" id="${k}-v">…</b></button>`;
  return h + `<div class="att"><span>Solde attendu</span><b class="num ${att < 0 ? 'neg' : ''}">${F(att)}</b></div>
      <details class="detail"><summary>${ICO('chev-r')}Comment c’est calculé</summary>${tableDecomp(c, L.decomposition(S, id, null, Date.now() + 1))}</details>
    <div class="lbl" style="text-align:center;margin-top:var(--s2)">${pdv ? 'Compte les deux : électronique + espèces' : 'Solde réel lu sur ton compte'}</div>
    ${pdv ? `<div class="duo">${partBtn('w-uv', 'Électronique', 'phone')}${partBtn('w-esp', 'Espèces', 'cash')}</div>` : ''}
    ${montantHTML('w-reel')}<div class="ctx" id="w-ctx"></div>

// Sauvegarde
function nomFichier() { return 'caisses-sauvegarde-' + auj() + '.json'; }
function telecharger(texte, nomF, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texte], { type }));
  a.download = nomF; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function partagerFichier(texte, nomF, types) {
  if (!navigator.share || !navigator.canShare) return false;
  for (const t of types) {
    const f = new File([texte], nomF, { type: t });
    if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: nomF }); return true; }
  }
  return false;
}
ACT.exporter = async d => {
  const ancien = S.derniereSauvegarde;
  S.derniereSauvegarde = Date.now();
  const txt = L.exporter(S);
  if (d.partager) {
    try {
      if (await partagerFichier(txt, nomFichier(), ['application/json', 'text/plain'])) { sauver(); rendre(); toast('Sauvegarde envoyée'); return; }
      toast('Envoi impossible ici : utilise « Télécharger »', null, 'err');
    } catch (e) { if (e && e.name !== 'AbortError') toast('Envoi impossible : utilise « Télécharger »', null, 'err'); }
    S.derniereSauvegarde = ancien; return;
  }
  telecharger(txt, nomFichier(), 'application/json');
  sauver(); rendre(); toast('Fichier de sauvegarde téléchargé');
};

  const ev = (uid, debut, rrule, titre, desc) => ['BEGIN:VEVENT', 'UID:' + uid + '@caisses-herve', 'DTSTAMP:' + stamp, 'DTSTART:' + debut, 'DURATION:PT15M', 'RRULE:' + rrule, 'SUMMARY:' + titre, 'DESCRIPTION:' + desc, 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + titre, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT'];
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Caisses Herve//FR', 'CALSCALE:GREGORIAN',
    ...[].concat(...heuresAgenda().map(x => ev('cloture-' + x.h, auj().replace(/-/g, '') + 'T' + L.pad(x.h) + '0000', 'FREQ=DAILY', 'Clôture : ' + x.noms.join(', '), 'Ouvre l’appli Caisses et compte ' + x.noms.join(', ') + '.'))),
    ...ev('salaire', L.dateSalaire(S, mois).replace(/-/g, '') + 'T090000', regle, 'Verser mon salaire (Caisses)', 'Ouvre l’appli Caisses et appuie sur « Verser mon salaire ».'),
    'END:VCALENDAR'].join('\r\n');
  try { if (await partagerFichier(ics, 'rappels-caisses.ics', ['text/calendar'])) return; } catch (e) { if (e && e.name === 'AbortError') return; }
  telecharger(ics, 'rappels-caisses.ics', 'text/calendar');
  toast('Ouvre le fichier téléchargé pour l’ajouter à l’agenda', null, 'info');
};
let _installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _installPrompt = e; });
window.addEventListener('appinstalled', () => { _installPrompt = null; toast('Caisses est installée sur ton téléphone'); });
ACT.installer = async () => {
  if (_installPrompt) { _installPrompt.prompt(); await _installPrompt.userChoice; _installPrompt = null; return; }
  if (window.matchMedia('(display-mode: standalone)').matches) { toast('L’appli est déjà installée'); return; }
  toast('Menu du navigateur (⋮ ou Partager) → « Ajouter à l’écran d’accueil »', null, 'info');
};

/* ── Écouteurs globaux ── */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  try { const r = f(b.dataset, b, e); if (r && r.catch) r.catch(erreur); } catch (err) { erreur(err); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 's-date' && t.value && UI.saisie) { UI.saisie.jour = t.value; $('#s-jours').querySelectorAll('.puce').forEach(x => x.classList.toggle('on', x.id === 's-date-l')); $('#s-date-t').textContent = L.dateCourte(t.value); }
  if (t.classList && t.classList.contains('sal-part')) {
    const tot = [...document.querySelectorAll('.sal-part')].reduce((s, i) => s + (L.parseMontant(i.value) || 0), 0);
    const el = $('#sal-total'); if (el) el.textContent = F(tot);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  try {
    if (t.id === 'perso-sel') { S.reglages.caissePerso = t.value; S.reglages.salaire.parts = S.reglages.salaire.parts.filter(p => p.caisse !== t.value); sauver(); toast('Le salaire ira dans « ' + L.nom(S, t.value) + ' »'); }
    if (t.id === 's-salon' && UI.saisie) { UI.saisie.pourSalon = t.checked; $('#s-cats').innerHTML = catsHTML(UI.saisie); }
    if (t.dataset && t.dataset.heureCaisse) { const c = L.modifierCaisse(S, t.dataset.heureCaisse, { heureCloture: t.value }); sauver(); rendre(); toast(c.nom + ' : ' + (c.heureCloture == null ? 'pas de clôture chaque jour' : 'clôture à ' + c.heureCloture + ' h')); }
    if (t.id === 'fichier' && t.files && t.files[0]) {
      const lecteur = new FileReader();
      lecteur.onload = () => { try { UI.importEnAttente = L.importer(String(lecteur.result)); ouvrir({ type: 'import' }); } catch (err) { erreur(err); } };
      lecteur.onerror = () => erreur('Fichier illisible');
      lecteur.readAsText(t.files[0]);
    }
  } catch (err) { erreur(err); }
});
// Clavier physique : chiffres et Retour arrière vont au pavé visible, Entrée valide.
document.addEventListener('keydown', e => {
  if (!UI.feuille) return;
  const champ = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const pv = [...document.querySelectorAll('#feuille .pave')].find(p => !p.closest('.cache'));
  if (pv && !champ && (/^[0-9]$/.test(e.key) || e.key === 'Backspace')) { e.preventDefault(); try { ACT.kp({ for: pv.dataset.pave, k: e.key === 'Backspace' ? 'del' : e.key }); } catch (err) { erreur(err); } return; }
  if (e.key === 'Escape') { fermer(); return; }
  if (e.key !== 'Enter' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
  const map = { saisie: 's-ok', pret: 'p-ok', remb: 'r-ok' };
  let a = map[UI.feuille.type];
  if (UI.feuille.type === 'wiz' && UI.wiz && !UI.wiz.cl && UI.wiz.i < UI.wiz.liste.length) a = 'wiz-ok';
  if (!a) return;
  e.preventDefault();
  try { ACT[a]({}); } catch (err) { erreur(err); }
});
// Rafraîchir rappels et soldes quand on revient sur l'appli (ex. le soir)
const VUES_AUTO = ['accueil', 'cloture', 'prets', 'bilan', 'salon', 'point'];
document.addEventListener('visibilitychange', () => { if (!document.hidden && !UI.feuille && VUES_AUTO.includes(UI.vue)) rendre(); });
setInterval(() => { if (!document.hidden && !UI.feuille && VUES_AUTO.includes(UI.vue)) rendre(); }, 5 * 60 * 1000);

/* ── Préparé pour plus tard : pré-remplissage par les bots PRADEX (NON branché, rien ne l'appelle) ──
   Exemple futur : CaissesPrefill.ajouter([{type:'entree', caisse:'pradex', montant:15000, refExterne:'tx-123'}], 'bot-pradex')  */
window.CaissesPrefill = Object.freeze({
  ajouter(ops, source) { const r = L.ajouterMouvementsExternes(S, ops, source); if (r.ajoutes.length) { sauver(); rendre(); } return r; },
});

/* ── Démarrage ── */
charger();
rendre();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
